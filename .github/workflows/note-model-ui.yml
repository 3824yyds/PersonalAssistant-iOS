name: Companion text mode and keyboard checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  sticker-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 Scripts/verify_companion_stickers.py
  focused-ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python3 Scripts/select-xcode.py
      - run: python3 Scripts/generate_project.py
      - name: Boot iOS 26 simulator
        run: |
          python3 - <<'PY'
          import json,subprocess,os
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          candidates=[dict(d,runtime=r) for r,ds in devices.items() if 'iOS-26-' in r for d in ds if d['name'].startswith('iPhone')]
          candidates.sort(key=lambda d:('Max' in d['name'],'Plus' in d['name'],'Pro' in d['name'],d['name']))
          assert candidates,'No iOS 26 iPhone simulator'
          selected=candidates[0]
          types=json.loads(subprocess.check_output(['xcrun','simctl','list','devicetypes','--json']))['devicetypes']
          kind=next(t['identifier'] for t in types if t['name']==selected['name'])
          device=subprocess.check_output(['xcrun','simctl','create','Companion CI',kind,selected['runtime']],text=True,timeout=90).strip()
          for attempt in range(2):
              try:
                  subprocess.run(['xcrun','simctl','boot',device],check=False,timeout=60)
                  subprocess.run(['xcrun','simctl','bootstatus',device,'-b'],check=True,timeout=360)
                  break
              except (subprocess.TimeoutExpired,subprocess.CalledProcessError):
                  if attempt:raise
                  subprocess.run(['xcrun','simctl','shutdown',device],check=False,timeout=60)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SIMULATOR_ID='+device+'\n')
          PY
      - name: Companion UI, crypto and network tool integration
        run: |
          mkdir -p build
          xcodebuild -project PersonalAssistant.xcodeproj -scheme PersonalAssistant -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath build/Companion.xcresult -only-testing:AssistantTests/DeepSeekWebTests -only-testing:AssistantTests/CompositionTests -only-testing:AssistantUITests/CompanionUITests -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES test > build/companion-tests.log 2>&1 || { tail -n 120 build/companion-tests.log; exit 1; }
      - name: Export UI screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path build/Companion.xcresult --output-path build/Screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-test-results
          path: |
            build/companion-tests.log
            build/Screenshots
          retention-days: 7
