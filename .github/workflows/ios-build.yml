name: iOS build and unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Core finance and migration tests
        run: swift test
  ios-smoke:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ios: [18, 26]
        suite: [main, audit]
    steps:
      - uses: actions/checkout@v4
      - name: Select iOS 26 toolchain
        run: python3 Scripts/select-xcode.py
      - run: python3 Scripts/generate_project.py
      - name: Select an installed iPhone simulator
        run: |
          python3 - <<'PY'
          import json,subprocess,os
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          candidates=[d for runtime,ds in devices.items() if 'iOS-${{ matrix.ios }}-' in runtime for d in ds if d['name'].startswith('iPhone')]
          candidates.sort(key=lambda d:('Max' in d['name'],'Plus' in d['name'],'Pro' in d['name'],d['name']))
          assert candidates,'No available iPhone simulator'
          print('Simulator:',candidates[0]['name'])
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SIMULATOR_ID='+candidates[0]['udid']+'\n')
          PY
      - name: Wait for simulator startup
        run: |
          python3 - <<'PY'
          import os,subprocess
          device=os.environ['SIMULATOR_ID']
          subprocess.run(['xcrun','simctl','boot',device],check=False,timeout=30)
          subprocess.run(['xcrun','simctl','bootstatus',device,'-b'],check=True,timeout=240)
          PY
      - name: Focused iOS 26 chat regression
        if: matrix.ios == 26 && matrix.suite == 'main'
        run: |
          mkdir -p build
          xcodebuild -project PersonalAssistant.xcodeproj -scheme PersonalAssistant -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath build/ChatRegression.xcresult -only-testing:AssistantUITests/Build6Tests/testChatCreatesActualNotesIncomeExpenseAndReminderAndClarifiesAccount -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES test > build/chat-regression.log 2>&1 || { tail -n 100 build/chat-regression.log; exit 1; }
      - name: iOS crypto, migration and UI smoke tests
        run: |
          mkdir -p build
          if [ "${{ matrix.suite }}" = "audit" ]; then
            TEST_FILTER="-only-testing:AssistantUITests/ProductAuditTests"
          else
            TEST_FILTER="-skip-testing:AssistantUITests/ProductAuditTests"
          fi
          xcodebuild -project PersonalAssistant.xcodeproj -scheme PersonalAssistant -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath build/Tests.xcresult "$TEST_FILTER" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES test > build/simulator-test.log 2>&1 || { grep -A 6 -B 2 'error:' build/simulator-test.log || true; tail -n 120 build/simulator-test.log; exit 1; }
      - name: Export test screenshots
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/Screenshots || true
          fi
          if [ -d build/ChatRegression.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ChatRegression.xcresult --output-path build/ChatScreenshots || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results-${{ matrix.ios }}-${{ matrix.suite }}
          path: |
            build/simulator-test.log
            build/chat-regression.log
            build/Screenshots/
            build/ChatScreenshots/
          retention-days: 7
  ipa:
    needs: [core, ios-smoke]
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select iOS 26 toolchain
        run: python3 Scripts/select-xcode.py
      - id: toolchain
        run: echo "sdk=$(xcrun --sdk iphoneos --show-sdk-build-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: NativeBuild/iphoneos/lib
          key: ios-native-${{ steps.toolchain.outputs.sdk }}-${{ hashFiles('Vendor/llama.cpp/**', 'Scripts/build-native.sh') }}
      - name: Build Metal runtime
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash Scripts/build-native.sh
      - name: Build device IPA
        run: bash Scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalAssistant-iOS-3.5.1-build6-unsigned
          path: |
            build/*.ipa
            build/*.verification.json
            build/SHA256SUMS.txt
            build/device-build.log
          retention-days: 14
