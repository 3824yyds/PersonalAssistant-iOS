name: iOS device IPA package only
on:
  workflow_dispatch:
    inputs:
      ui_run_id:
        description: Companion verification run for the same commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipa:
    permissions:
      contents: write
      actions: read
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select iOS 26 toolchain
        run: python3 Scripts/select-xcode.py
      - id: toolchain
        run: echo "sdk=$(xcrun --sdk iphoneos --show-sdk-build-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: NativeBuild/iphoneos/lib
          key: ios-native-${{ steps.toolchain.outputs.sdk }}-${{ hashFiles('Vendor/llama.cpp/**', 'Scripts/build-native.sh') }}
      - name: Build Metal runtime
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash Scripts/build-native.sh
      - name: Build device IPA
        run: bash Scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalAssistant-iOS-3.5.1-build15-unsigned
          compression-level: 0
          path: |
            build/*.ipa
            build/*.verification.json
            build/SHA256SUMS.txt
            build/device-build.log
          retention-days: 14
      - name: Require successful companion checks before release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/wait_companion_checks.py '${{ inputs.ui_run_id }}'
      - name: Publish verified install package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json,os,subprocess
          from pathlib import Path
          verification=next(Path('build').glob('*.verification.json'))
          result=json.loads(verification.read_text())
          note=Path('build/release-notes.md')
          note.write_text(Path('Docs/BUILD15_RELEASE.md').read_text()+f"\n安装包 SHA-256：{result['sha256']}\n")
          repo=os.environ['GITHUB_REPOSITORY'];tag='v3.5.1-build15'
          existing=subprocess.run(['gh','release','view',tag,'--repo',repo],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          if existing.returncode:
              subprocess.run(['gh','release','create',tag,'--repo',repo,'--target',os.environ['GITHUB_SHA'],'--prerelease','--latest=false','--title','个人助理 3.5.1 Build 15','--notes-file',str(note)],check=True)
          subprocess.run(['gh','release','upload',tag,'--repo',repo,*map(str,Path('build').glob('*.ipa')),str(verification),'build/SHA256SUMS.txt','--clobber'],check=True)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: companion-device-build-log
          path: build/device-build.log
          retention-days: 7
